name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shelf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the toolbox and the chapters' libraries
        run: make install install-dl
      - name: Lint (the package and every notebook)
        run: make lint
      - name: Toolbox tests
        run: make test
      - name: Every chapter re-executed offline
        run: make notebooks
      - name: No private names, no secrets (the same make scan as locally)
        run: make scan
